# Render Blueprint — Vantage AI backend (Node + Python in one Docker image).
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Set every `sync: false` value in the dashboard on first deploy.
services:
  - type: web
    name: vantage-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    region: frankfurt
    plan: starter          # free spins down and stops the in-process scheduler
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_BIN
        value: /usr/bin/python3

      # ── Public client config (also needed at Docker build time for Vite) ──
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SELAR_DAILY_LINK
        sync: false
      - key: VITE_SELAR_WEEKLY_LINK
        sync: false
      - key: VITE_SELAR_MONTHLY_LINK
        sync: false
      - key: VITE_SELAR_ANNUAL_LINK
        sync: false

      # ── Server secrets ──
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_API_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TCHOKOPAY_API_KEY
        sync: false
      - key: TCHOKOPAY_WEBHOOK_SECRET
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: BETMINES_PROXY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SENTRY_DSN
        sync: false
